name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            target: node22-linux-x64
            ext: ''
          - os: macos-latest
            platform: macos
            arch: x64
            target: node22-macos-x64
            ext: ''
          - os: windows-latest
            platform: windows
            arch: x64
            target: node22-win-x64
            ext: '.exe'

    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build TypeScript
        run: npm run build

      - name: Package binary
        run: npx pkg dist/index.js --targets ${{ matrix.target }} --output ai-cli-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-cli-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.ext }}
          path: ai-cli-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.ext }}
          if-no-files-found: error

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ai-cli-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.ext }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker Build & Push
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          docker build -t ${{ secrets.DOCKER_USERNAME }}/ai-cli:${VERSION} .
          docker build -t ${{ secrets.DOCKER_USERNAME }}/ai-cli:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/ai-cli:${VERSION}
          docker push ${{ secrets.DOCKER_USERNAME }}/ai-cli:latest
